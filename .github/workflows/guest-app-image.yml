name: guest-app-image

# Guest-only CI/CD: public/ builds to Harbor; main builds promote their exact digest.
on:
  push:
    branches: [main]
    tags: ['guest-v*']
    paths: ['public/**', 'deploy/**', '.github/workflows/guest-app-image.yml']
  pull_request:
    paths: ['public/**', 'deploy/**', '.github/workflows/guest-app-image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: registry.tgm.one
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.tgm.one/oneparty/guest
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/guest-v') }}
            type=sha,prefix=sha-
            type=match,pattern=guest-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=guest-v(\d+\.\d+),group=1
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: public
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: image
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin the just-built digest on current main
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          REF_NAME: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$REF_NAME" = refs/heads/main
          fi
          sed -i -E "s#(image: registry\.tgm\.one/oneparty/guest@)sha256:[0-9a-f]{64}#\\1${IMAGE_DIGEST}#" deploy/k8s/deployment.yaml
          grep -Fq "image: registry.tgm.one/oneparty/guest@${IMAGE_DIGEST}" deploy/k8s/deployment.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(guest): promote ${EXPECTED_SHA} [skip ci]"
          git push origin HEAD:main
