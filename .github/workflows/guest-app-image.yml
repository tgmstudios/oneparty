name: guest-app-image

# Builds the cloud guest app (public/) and pushes it to GitHub Container Registry as ghcr.io/<owner>/oneparty-guest.
#   push to main touching public/  -> :latest and :sha-<short>
#   tag guest-v1.2.3               -> :1.2.3, :1.2 and :latest
#   pull requests                  -> test + build only, nothing is pushed
on:
  push:
    branches: [main]
    tags: ['guest-v*']
    paths: ['public/**', '.github/workflows/guest-app-image.yml']
  pull_request:
    paths: ['public/**', '.github/workflows/guest-app-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: guest-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci
      - run: npm test   # builds the Vue site first (pretest), then runs the server tests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oneparty-guest
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/guest-v') }}
            type=sha,prefix=sha-
            type=match,pattern=guest-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=guest-v(\d+\.\d+),group=1
      - uses: docker/build-push-action@v6
        with:
          context: public
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
