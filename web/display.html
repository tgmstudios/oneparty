<!doctype html><html><head><meta charset="utf-8"><title>oneparty display</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;font-family:system-ui,sans-serif;color:#fff}
.layer{position:absolute;inset:0;transition:opacity .5s}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 18px #000}
.np{position:absolute;left:3vw;bottom:3vw;display:flex;gap:1.4vw;align-items:flex-end;background:rgba(0,0,0,.35);padding:1vw;border-radius:1vw;backdrop-filter:blur(8px)}
.np .art{width:7vw;height:7vw;border-radius:.6vw;object-fit:cover;background:#222}
.np .ttl{font-size:2vw;font-weight:800}.np .art-name{font-size:1.4vw;opacity:.8;margin-bottom:.6vw}
.np .bar{width:22vw;height:.35vw;background:rgba(255,255,255,.25);border-radius:1vw;overflow:hidden}.np .bar i{display:block;height:100%;width:0;background:var(--accent,#ff6a10)}
.lyr{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 6vw}
.lyr .l{min-height:1.2em;line-height:1.25}.lyr .cur{font-size:4.2vw;font-weight:900}.lyr .prev,.lyr .next{font-size:2vw;opacity:.45}
#veil{background:#000;opacity:0;pointer-events:none;z-index:9}
#veil.on{opacity:1}
#err{position:absolute;left:1vw;top:1vw;font:12px monospace;color:#f66;z-index:10;white-space:pre-wrap}
</style></head><body>
<div id="stage" class="layer"></div><div id="hud" class="layer"></div><div id="veil" class="layer"></div><div id="err"></div>
<script type="module" src="/js/display.js"></script>
</body></html>
