<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;font-family:system-ui,sans-serif;color:#fff}
.layer{position:absolute;inset:0;transition:opacity .5s}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hud{position:absolute;inset:0;pointer-events:none;font-family:Inter,"Segoe UI",system-ui,sans-serif;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.panel{position:absolute;right:2vw;top:50%;transform:translateY(-50%);width:24vw;display:flex;flex-direction:column;gap:.9vw;transition:opacity .6s}
#hud.idle .panel{opacity:0}
.np[hidden],.lyr[hidden],.ann[hidden],.jam[hidden],.bubbles[hidden]{display:none}
.bubbles.top{top:3vh;bottom:auto;height:auto;min-height:12vh}
.bubbles.top .slot{top:0;bottom:auto;justify-content:flex-end}
.panel{top:46%}
.np{position:relative;overflow:hidden}
.np .art{transition:transform .12s linear}
.motion .np .art{transform:scale(calc(1 + var(--beat,0) * .06));box-shadow:0 0 calc(1.2vw + var(--beat,0) * 2.4vw) color-mix(in srgb,var(--accent) 60%,transparent)}
.np::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-120%)}
.motion.playing .np::after{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

/* left: announcements + Jam QR */
.left{position:absolute;left:2vw;top:50%;transform:translateY(-50%);width:22vw;display:flex;flex-direction:column;align-items:flex-start;gap:.9vw}
.ann,.jam{background:rgba(10,8,18,.42);border:1px solid rgba(255,255,255,.10);border-radius:1.3vw;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1vw 3.5vw rgba(0,0,0,.45);padding:1.2vw 1.4vw}
.ann{border-left:.35vw solid var(--accent)}
.a-t{font-size:2vw;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.a-d{font-size:1.5vw;font-weight:600;color:var(--accent);margin-top:.4vw}
.ann.in,.jam:not(.out){animation:annIn .7s cubic-bezier(.2,.9,.2,1) both}
.ann.out,.jam.out{animation:annOut .6s ease-in both}
@keyframes annIn{from{opacity:0;transform:translateX(-3vw) scale(.96)}to{opacity:1;transform:none}}
@keyframes annOut{to{opacity:0;transform:translateX(-3vw)}}
.jam{text-align:center;align-self:flex-start;width:fit-content;padding:.7vw .8vw}.jam .qr{display:block;margin:0 auto;width:8.5vw;height:8.5vw;border-radius:.6vw;background:#fff;image-rendering:pixelated}
.j-t{font-size:.95vw;font-weight:700;margin-top:.5vw}.j-s{font-size:.65vw;opacity:.6;letter-spacing:.12em;text-transform:uppercase}

/* bottom right: rotating bubbles */
.bubbles{position:absolute;right:2vw;bottom:3vh;width:24vw;height:20vh;overflow:visible}
.bubbles .slot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end}
.bub{display:flex;gap:.8vw;align-items:center;max-width:100%;padding:.8vw 1.2vw;border-radius:1.6vw 1.6vw .4vw 1.6vw;background:color-mix(in srgb,var(--accent) 24%,rgba(10,8,18,.55));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 .8vw 2.4vw rgba(0,0,0,.4);animation:bubIn .75s cubic-bezier(.2,1.1,.3,1.15) both}
.bub.out{animation:bubOut .9s ease-in both}
.bub .bt{font-size:1.25vw;font-weight:700;line-height:1.25}.bub .bs{font-size:.95vw;opacity:.75}
.bub .lab{font-size:.7vw;letter-spacing:.16em;font-weight:800;color:var(--accent)}
.bub.next{border-radius:1.6vw 1.6vw 1.6vw .4vw}.bub.next img{width:3.6vw;height:3.6vw;border-radius:.6vw;object-fit:cover}
@keyframes bubIn{from{opacity:0;transform:translateY(4vh) scale(.7)}to{opacity:1;transform:none}}
@keyframes bubOut{to{opacity:0;transform:translateY(-9vh) scale(.92)}}
.np,.lyr{background:rgba(10,8,18,.40);border:1px solid rgba(255,255,255,.10);border-radius:1.3vw;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1vw 3.5vw rgba(0,0,0,.45)}
.np{display:flex;gap:.9vw;align-items:center;padding:.8vw}
.np .art{width:5vw;height:5vw;border-radius:.8vw;object-fit:cover;background:#222;flex:none;box-shadow:0 0 1.8vw color-mix(in srgb,var(--accent) 45%,transparent)}
.np .meta{min-width:0;flex:1}
.np .ttl{font-size:1.2vw;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .art-name{font-size:.9vw;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.1vw 0 .55vw}
.np .bar{height:.26vw;background:rgba(255,255,255,.18);border-radius:1vw;overflow:hidden}
.np .bar i{display:block;height:100%;width:0;background:var(--accent,#ff6a10);border-radius:1vw}
.np .tm{display:flex;justify-content:space-between;font-size:.65vw;opacity:.5;margin-top:.3vw;font-variant-numeric:tabular-nums}
.lyr{position:relative;height:36vh;overflow:hidden}.lyr.empty{display:none}
.lyr .vp{position:absolute;inset:0;padding:0 1.2vw;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.lyr .lines{transition:transform .55s cubic-bezier(.2,.8,.2,1);will-change:transform}
.ln{font-size:1vw;font-weight:600;line-height:1.35;padding:.45vw 1vw .45vw 0;opacity:.25;transform-origin:left center;width:calc(100% / 1.14);box-sizing:border-box;white-space:normal;overflow-wrap:anywhere;word-break:normal;hyphens:auto;transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1)}
.ln.m{opacity:.35}.ln.n{opacity:.55}
.ln.c{opacity:1;transform:scale(1.14);text-shadow:0 0 1.2vw color-mix(in srgb,var(--accent) 65%,transparent)}
#veil{background:#000;opacity:0;pointer-events:none;z-index:9}
#veil.on{opacity:1}
#white{opacity:0;pointer-events:none;z-index:9;background:#fff}
#white.on{opacity:1}
#white canvas{width:100%;height:100%;display:block}
#err{position:absolute;left:1vw;top:1vw;font:12px monospace;color:#f66;z-index:10;white-space:pre-wrap}

/* NEXT UP bubble = same card as now playing */
.bub.next{width:100%;display:flex;gap:.9vw;align-items:center;padding:.8vw;border-radius:1.3vw;background:rgba(10,8,18,.40);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1vw 3.5vw rgba(0,0,0,.45)}
.bub.next .art{width:5vw;height:5vw;border-radius:.8vw;object-fit:cover;background:#222;flex:none;box-shadow:0 0 1.8vw color-mix(in srgb,var(--accent) 45%,transparent)}
.bub.next .meta{min-width:0;flex:1}
.bub.next .lab{font-size:.65vw;letter-spacing:.18em;font-weight:800;color:var(--accent);margin-bottom:.15vw}
.bub.next .ttl{font-size:1.2vw;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub.next .art-name{font-size:.9vw;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.1vw 0 .55vw}
.bub.next .bar{height:.26vw;background:rgba(255,255,255,.18);border-radius:1vw;overflow:hidden}
.bub.next .bar i{display:block;height:100%;width:0;background:var(--accent,#ff6a10);border-radius:1vw}
.bub.next .tm{display:flex;justify-content:space-between;font-size:.65vw;opacity:.5;margin-top:.3vw;font-variant-numeric:tabular-nums}

/* announcement: neon ticket card in the bottom-right rotation */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes angspin{to{--ang:360deg}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-20deg)}60%{opacity:1;transform:scale(.94) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
.bub.ann{position:relative;overflow:hidden;display:flex;align-items:center;gap:1vw;width:100%;padding:.95vw 1vw .95vw 1.4vw;border-radius:1.5vw;border:.16vw solid transparent;
  background:linear-gradient(rgba(12,8,20,.80),rgba(12,8,20,.80)) padding-box,
             conic-gradient(from var(--ang),var(--accent),rgba(255,255,255,.10) 22%,var(--accent) 50%,rgba(255,255,255,.10) 72%,var(--accent)) border-box;
  box-shadow:0 0 2.6vw color-mix(in srgb,var(--accent) 35%,transparent),0 1vw 3vw rgba(0,0,0,.5);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  animation:bubIn .75s cubic-bezier(.2,1.1,.3,1.15) both,angspin 5s linear infinite}
.bub.ann.out{animation:bubOut .9s ease-in both}
.bub.ann::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.5s 1.2s ease-in-out infinite}
.bub.ann .a-main{min-width:0;flex:1}
.bub.ann .a-tag{display:flex;align-items:center;gap:.45vw;font-size:.62vw;font-weight:800;letter-spacing:.24em;color:var(--accent);margin-bottom:.25vw}
.bub.ann .a-tag i{width:.45vw;height:.45vw;border-radius:50%;background:var(--accent);box-shadow:0 0 .8vw var(--accent);animation:blink 1.1s ease-in-out infinite}
.bub.ann .a-t{font-size:1.95vw;font-weight:800;letter-spacing:-.02em;line-height:1.08;text-shadow:0 0 1.4vw color-mix(in srgb,var(--accent) 55%,transparent);overflow-wrap:anywhere}
.bub.ann .a-d{font-size:1.1vw;font-weight:600;opacity:.8;margin-top:.3vw}
.bub.ann .a-price{flex:none;position:relative;padding:.5vw 1.1vw .5vw 1.3vw;font-size:2.2vw;font-weight:900;letter-spacing:-.02em;line-height:1;color:#160a02;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));border-radius:.9vw;
  box-shadow:0 .4vw 1.6vw color-mix(in srgb,var(--accent) 55%,transparent);transform:rotate(-4deg);animation:stamp .65s .3s cubic-bezier(.2,1.5,.4,1) both;
  -webkit-mask:radial-gradient(circle .42vw at 0 50%,transparent 97%,#000) ;mask:radial-gradient(circle .42vw at 0 50%,transparent 97%,#000)}

/* message bubble: glossy speech bubble */
@keyframes msgPop{0%{opacity:0;transform:translateY(-14vh) scale(.5) rotate(6deg)}55%{opacity:1;transform:translateY(1.2vh) scale(1.07) rotate(-1.5deg)}78%{transform:translateY(-.3vh) scale(.97) rotate(.5deg)}100%{opacity:1;transform:none}}
@keyframes msgPopOut{0%{opacity:1;transform:none}30%{transform:scale(1.1)}100%{opacity:0;transform:translateY(-12vh) scale(.4)}}
@keyframes sparkSpin{to{transform:rotate(360deg)}}
@keyframes textShine{to{background-position:-200% 0}}
.bub.msg{position:relative;gap:.7vw;padding:.85vw 1.4vw .85vw 1.1vw;margin-bottom:.9vw;border-radius:1.9vw 1.9vw .5vw 1.9vw;transform-origin:90% 100%;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 38%,rgba(255,255,255,.10)),color-mix(in srgb,var(--accent) 16%,rgba(14,8,26,.78)));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 .12vw 0 rgba(255,255,255,.28),0 0 2.2vw color-mix(in srgb,var(--accent) 45%,transparent),0 1vw 2.6vw rgba(0,0,0,.45);
  animation:msgPop .85s cubic-bezier(.2,.9,.25,1) both}
.bub.msg.out{animation:msgPopOut .6s ease-in both}
.bub.msg::after{content:"";position:absolute;right:1.3vw;bottom:-.75vw;width:1.2vw;height:1.2vw;background:inherit;border-right:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);transform:skewX(-28deg) rotate(45deg) scale(.7);border-radius:0 0 .5vw 0}
.bub.msg .spark{flex:none;font-size:1.3vw;line-height:1;color:var(--accent);text-shadow:0 0 .9vw var(--accent);animation:sparkSpin 5s linear infinite}
.bub.msg .bt{font-size:1.3vw;font-weight:800;letter-spacing:-.01em;line-height:1.2;
  background:linear-gradient(90deg,#fff 0%,#fff 40%,color-mix(in srgb,var(--accent) 45%,#fff) 50%,#fff 60%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:textShine 3.2s linear infinite}

/* spectrum visualizer in the now-playing card */
.viz{display:none;flex:none;width:2.4vw;height:2.6vw;align-self:flex-end;margin-bottom:.2vw}
.motion .viz{display:block}
.bub .bt,.bub .a-t,.bub .a-d{white-space:pre-line}
</style></head><body>
<div id="stage" class="layer"></div><div id="hud" class="layer"></div><div id="veil" class="layer"></div><div id="white" class="layer"></div><div id="err"></div>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/js/display.js"></script>
